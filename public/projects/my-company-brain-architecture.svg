<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
  <title id="title">My Company Brain system architecture</title>
  <desc id="desc">Four-layer architecture map showing the browser and Next.js experience, the Unified API, Agent Gateway and Platform Domain control plane, three protected knowledge paths, and their PostgreSQL and Neo4j data stores.</desc>
  <defs>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A63D2F" />
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8174" />
    </marker>
    <style>
      .layer-label { font: 700 13px Arial, sans-serif; letter-spacing: 2.4px; fill: #A63D2F; }
      .title { font: 48px Georgia, serif; fill: #171717; }
      .legend { font: 13px Arial, sans-serif; fill: #555555; }
      .node-title { font: 700 16px Arial, sans-serif; letter-spacing: 1px; fill: #171717; }
      .node-copy { font: 14px Arial, sans-serif; fill: #555555; }
      .mono { font: 13px Consolas, monospace; fill: #555555; }
      .card { fill: #FBF8F1; stroke: #171717; stroke-width: 1.5; }
      .module-card { fill: #FBF8F1; stroke: #A63D2F; stroke-width: 1.5; }
      .divider { stroke: #C9BDA8; stroke-width: 1; }
      .main-flow { fill: none; stroke: #A63D2F; stroke-width: 2.5; marker-end: url(#arrow-primary); }
      .protected-flow { fill: none; stroke: #A63D2F; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-primary); }
      .data-flow { fill: none; stroke: #8A8174; stroke-width: 1.5; marker-end: url(#arrow-data); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#F4F0E8" />

  <text class="title" x="64" y="62">System architecture</text>
  <g aria-label="Connector legend">
    <path class="main-flow" d="M64 96H104" />
    <text class="legend" x="116" y="101">PRIMARY REQUEST</text>
    <path class="protected-flow" d="M294 96H334" />
    <text class="legend" x="346" y="101">PROTECTED CALL</text>
    <path class="data-flow" d="M504 96H544" />
    <text class="legend" x="556" y="101">DATA OWNERSHIP</text>
  </g>

  <path class="divider" d="M64 270H1336" />
  <path class="divider" d="M64 480H1336" />
  <path class="divider" d="M64 680H1336" />

  <text class="layer-label" x="64" y="145">01 / EXPERIENCE</text>
  <text class="layer-label" x="64" y="295">02 / CONTROL PLANE</text>
  <text class="layer-label" x="64" y="510">03 / KNOWLEDGE PLANE</text>
  <text class="layer-label" x="64" y="705">04 / DATA PLANE</text>

  <g>
    <rect class="card" x="90" y="170" width="190" height="78" />
    <text class="node-title" x="114" y="201">BROWSER</text>
    <text class="node-copy" x="114" y="220" textLength="140" lengthAdjust="spacingAndGlyphs">Team member / administrator</text>

    <rect class="card" x="390" y="165" width="360" height="86" />
    <text class="node-title" x="414" y="199">NEXT.JS WEB</text>
    <text class="node-copy" x="414" y="223" textLength="310" lengthAdjust="spacingAndGlyphs">Workspace, global Q&amp;A, knowledge, administration</text>
  </g>

  <g>
    <rect class="card" x="90" y="320" width="350" height="96" />
    <text class="node-title" x="114" y="358">UNIFIED API</text>
    <text class="node-copy" x="114" y="390">Identity, platform routes, module proxy</text>

    <rect class="card" x="525" y="320" width="350" height="96" />
    <text class="node-title" x="549" y="358">AGENT GATEWAY</text>
    <text class="node-copy" x="549" y="390">LangGraph, tools, SSE, checkpoints</text>

    <rect class="card" x="960" y="320" width="350" height="96" />
    <text class="node-title" x="984" y="358">PLATFORM DOMAIN</text>
    <text class="node-copy" x="984" y="390">Scenes, tasks, audit, global retrieval</text>
  </g>

  <g>
    <rect class="module-card" x="90" y="540" width="380" height="105" />
    <text class="node-title" x="114" y="580">NANO BRAIN</text>
    <text class="node-copy" x="114" y="613">Pages, facts, links, search / ask</text>

    <rect class="module-card" x="510" y="540" width="380" height="105" />
    <text class="node-title" x="534" y="580">TRADITIONAL RAG</text>
    <text class="node-copy" x="534" y="613">Documents, tables, hybrid retrieval, RRF</text>

    <rect class="module-card" x="930" y="540" width="380" height="105" />
    <text class="node-title" x="954" y="580">GRAPHRAG</text>
    <text class="node-copy" x="954" y="613">Entities, relations, graph search, governance</text>
  </g>

  <g>
    <rect class="card" x="190" y="730" width="760" height="82" />
    <text class="node-title" x="214" y="757">POSTGRESQL · 6 LOGICAL DATABASES</text>
    <text class="mono" x="214" y="781">identity / core / agent / nano / traditional / graph</text>

    <rect class="card" x="1030" y="730" width="280" height="82" />
    <text class="node-title" x="1054" y="757">NEO4J</text>
    <text class="node-copy" x="1054" y="781">GraphRAG workspace</text>
  </g>

  <g>
    <path class="main-flow" d="M280 206H390" />
    <path class="main-flow" d="M510 251V282H265V320" />
    <text class="mono" x="282" y="275">/api/platform/*</text>
    <path class="main-flow" d="M630 251V282H700V320" />
    <text class="mono" x="714" y="275">/api/agent/*</text>
    <path class="main-flow" d="M440 368H478V304H920V368H960" />
  </g>

  <g>
    <path class="protected-flow" d="M265 416V520" />
    <path class="protected-flow" d="M700 416V520" />
    <path class="protected-flow" d="M265 520H1120" />
    <path class="protected-flow" d="M280 520V540" />
    <path class="protected-flow" d="M700 520V540" />
    <path class="protected-flow" d="M1120 520V540" />
    <rect x="355" y="487" width="690" height="30" fill="#C9BDA8" />
    <text class="mono" x="700" y="507" text-anchor="middle">PROTECTED MODULE BOUNDARY · INTERNAL TOKEN · USER CONTEXT · RESOURCE FILTERS</text>
  </g>

  <g>
    <path class="data-flow" d="M280 645V690H380V730" />
    <path class="data-flow" d="M700 645V690H570V730" />
    <path class="data-flow" d="M1120 645V690H800V730" />
    <path class="data-flow" d="M1120 645V730" />
  </g>
</svg>
