<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">GraphRAGAgent application architecture</title>
  <desc id="desc">A four-band view of the GraphRAGAgent workspace, API boundary, parallel knowledge stores, QA retrieval calls, and cited outputs.</desc>
  <defs>
    <marker id="arrow-vermilion" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#C6442B" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7B746A" />
    </marker>
    <style>
      .band-label { font: 700 15px Arial, sans-serif; letter-spacing: 2.4px; fill: #C6442B; }
      .band-caption { font: 400 13px Arial, sans-serif; fill: #7B746A; }
      .node-label { font: 700 16px Arial, sans-serif; letter-spacing: 0.8px; fill: #171717; }
      .node-note { font: 400 13px Arial, sans-serif; fill: #7B746A; }
      .call-label { font: 700 11px Arial, sans-serif; letter-spacing: 1.2px; fill: #C6442B; }
      .node { fill: #FFFDF8; stroke: #171717; stroke-width: 2; }
      .knowledge { fill: #F1ECE3; stroke: #7B746A; stroke-width: 2; }
      .output { fill: #FFFDF8; stroke: #C6442B; stroke-width: 2; }
      .request { fill: none; stroke: #C6442B; stroke-width: 3; marker-end: url(#arrow-vermilion); }
      .retrieval { fill: none; stroke: #C6442B; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-vermilion); }
      .ownership { fill: none; stroke: #7B746A; stroke-width: 2; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#F4F0E8" />
  <path d="M72 82H1328" stroke="#C9BDA8" stroke-width="2" />
  <text x="72" y="53" class="band-label">GRAPHRAG / SYSTEM ARCHITECTURE</text>
  <text x="1328" y="53" class="band-caption" text-anchor="end">retrieval paths made visible</text>

  <g>
    <text x="72" y="112" class="band-label">01 EXPERIENCE</text>
    <text x="72" y="132" class="band-caption">Browser requests enter one workspace</text>
    <rect x="72" y="158" width="240" height="54" rx="9" class="output" />
    <text x="192" y="191" class="node-label" text-anchor="middle">BROWSER</text>
    <rect x="360" y="158" width="240" height="54" rx="9" class="output" />
    <text x="480" y="191" class="node-label" text-anchor="middle">USER REQUEST</text>
    <rect x="72" y="228" width="528" height="56" rx="9" class="node" />
    <text x="336" y="262" class="node-label" text-anchor="middle">REACT WORKSPACE</text>
    <path d="M192 212V228" class="request" />
    <path d="M480 212L430 228" class="request" />
  </g>

  <g>
    <text x="72" y="324" class="band-label">02 APPLICATION</text>
    <text x="72" y="344" class="band-caption">API routes documents, graph exploration, and questions</text>
    <rect x="72" y="370" width="528" height="58" rx="9" class="node" />
    <text x="336" y="405" class="node-label" text-anchor="middle">FASTAPI</text>
    <path d="M336 284V370" class="request" />

    <rect x="650" y="370" width="220" height="58" rx="9" class="node" />
    <text x="760" y="396" class="node-label" text-anchor="middle">DOCUMENTS</text>
    <text x="760" y="416" class="node-note" text-anchor="middle">upload + status</text>
    <rect x="910" y="370" width="220" height="58" rx="9" class="node" />
    <text x="1020" y="396" class="node-label" text-anchor="middle">GRAPH EXPLORER</text>
    <text x="1020" y="416" class="node-note" text-anchor="middle">D3 view + search</text>
    <rect x="1170" y="370" width="158" height="58" rx="9" class="node" />
    <text x="1249" y="396" class="node-label" text-anchor="middle">Q&amp;A ROUTER</text>
    <text x="1249" y="416" class="node-note" text-anchor="middle">questions</text>
    <path d="M600 388H650" class="request" />
    <path d="M600 399H910" class="request" />
    <path d="M600 410H1170" class="request" />
    <g id="document-indexing-flow" data-flow="documents-upload-to-indexing" aria-label="Documents upload to Indexing Pipeline">
      <path d="M650 428C620 452 52 452 52 536C52 548 60 555 72 555" class="request" />
      <text x="360" y="446" class="call-label" text-anchor="middle">DOCUMENT UPLOAD → INDEX</text>
    </g>
  </g>

  <g>
    <text x="72" y="472" class="band-label">03 KNOWLEDGE</text>
    <text x="72" y="492" class="band-caption">Index once; keep graph and vector retrieval stores parallel</text>
    <rect x="72" y="518" width="270" height="74" rx="9" class="knowledge" />
    <text x="207" y="550" class="node-label" text-anchor="middle">INDEXING PIPELINE</text>
    <text x="207" y="572" class="node-note" text-anchor="middle">parse · extract · index</text>
    <rect x="420" y="518" width="250" height="74" rx="9" class="knowledge" />
    <text x="545" y="550" class="node-label" text-anchor="middle">NETWORKX GRAPH</text>
    <text x="545" y="572" class="node-note" text-anchor="middle">entities + relations</text>
    <rect x="720" y="518" width="280" height="74" rx="9" class="knowledge" />
    <text x="860" y="550" class="node-label" text-anchor="middle">CHROMA VECTOR INDEX</text>
    <text x="860" y="572" class="node-note" text-anchor="middle">semantic context</text>
    <rect x="1080" y="518" width="248" height="74" rx="9" class="node" />
    <text x="1204" y="550" class="node-label" text-anchor="middle">QA AGENT</text>
    <text x="1204" y="572" class="node-note" text-anchor="middle">tools + synthesis</text>

    <path d="M342 548H420" class="ownership" />
    <path d="M342 565H720" class="ownership" />
    <path d="M670 537C820 505 950 505 1080 537" class="retrieval" />
    <path d="M1000 574C1030 595 1050 595 1080 574" class="retrieval" />
    <text x="825" y="505" class="call-label" text-anchor="middle">GRAPH RETRIEVAL</text>
    <text x="1038" y="614" class="call-label" text-anchor="middle">VECTOR RETRIEVAL</text>
    <path d="M1249 428V518" class="retrieval" />
  </g>

  <g>
    <text x="72" y="636" class="band-label">04 OUTPUT</text>
    <text x="72" y="654" class="band-caption">Make the answer and its visible graph context inspectable</text>
    <rect x="420" y="664" width="908" height="58" rx="9" class="output" />
    <text x="874" y="699" class="node-label" text-anchor="middle">GRAPH VIEW + ANSWER / CITED ENTITIES</text>
    <path d="M1020 428C1020 620 874 620 874 664" class="request" />
    <path d="M1204 592V664" class="request" />
  </g>
</svg>
