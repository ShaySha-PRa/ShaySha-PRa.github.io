<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SQLAgent query flow</title>
  <desc id="desc">Editorial data flow from natural language through RAG, NL2SQL, MySQL, and SSE charts.</desc>
  <rect width="1200" height="760" fill="#F4F0E8"/>
  <path d="M72 112H1128M72 648H1128" stroke="#C9BDA8" stroke-width="2"/>
  <text x="72" y="82" font-family="Georgia,serif" font-size="22" fill="#C6442B" letter-spacing="4">PROJECT 05 / DATA QUERY</text>
  <text x="72" y="210" font-family="Georgia,serif" font-size="74" fill="#171717">SQLAgent</text>
  <text x="74" y="260" font-family="Arial,sans-serif" font-size="20" fill="#555555">From natural language to visible results.</text>
  <g fill="none" stroke="#C6442B" stroke-width="4">
    <path d="M166 432H340M420 432H594M674 432H848M928 432H1080"/><path d="M380 392V320"/>
  </g>
  <g fill="#F4F0E8" stroke="#171717" stroke-width="3">
    <rect x="92" y="376" width="164" height="112"/><rect x="340" y="376" width="164" height="112"/>
    <rect x="594" y="376" width="164" height="112"/><rect x="848" y="376" width="164" height="112"/>
    <rect x="308" y="254" width="144" height="66"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#171717">
    <text x="174" y="422" font-size="16">NATURAL</text><text x="174" y="450" font-size="16">LANGUAGE</text>
    <text x="422" y="422" font-size="17">NL2SQL</text><text x="422" y="450" font-size="14" fill="#555555">query</text>
    <text x="676" y="422" font-size="17">MYSQL</text><text x="676" y="450" font-size="14" fill="#555555">database</text>
    <text x="930" y="422" font-size="17">SSE</text><text x="930" y="450" font-size="14" fill="#555555">results / charts</text>
    <text x="380" y="291" font-size="15">RAG CONTEXT</text>
  </g>
  <text x="72" y="700" font-family="Arial,sans-serif" font-size="16" fill="#555555">MILVUS / RETRIEVAL / QUERY / VISUALIZATION</text>
