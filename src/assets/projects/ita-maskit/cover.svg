<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ITA-Maskit local masking boundary</title>
  <desc id="desc">Editorial diagram showing local input, deterministic pseudonymization, desktop GUI, and masked output.</desc>
  <rect width="1200" height="760" fill="#F4F0E8"/>
  <path d="M72 112H1128M72 648H1128" stroke="#C9BDA8" stroke-width="2"/>
  <text x="72" y="82" font-family="Georgia,serif" font-size="22" fill="#C6442B" letter-spacing="4">PROJECT 06 / LOCAL DATA</text>
  <text x="72" y="210" font-family="Georgia,serif" font-size="74" fill="#171717">ITA-Maskit</text>
  <text x="74" y="260" font-family="Arial,sans-serif" font-size="20" fill="#555555">A clear local boundary for pseudonymization.</text>
  <rect x="94" y="326" width="1014" height="244" fill="none" stroke="#C9BDA8" stroke-width="2" stroke-dasharray="10 10"/>
  <g fill="none" stroke="#C6442B" stroke-width="4"><path d="M190 448H370M450 448H630M710 448H890"/></g>
  <g fill="#F4F0E8" stroke="#171717" stroke-width="3">
    <rect x="108" y="388" width="164" height="120"/><rect x="370" y="388" width="164" height="120"/>
    <rect x="630" y="388" width="164" height="120"/><rect x="890" y="388" width="190" height="120"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#171717">
    <text x="190" y="433" font-size="17">LOCAL INPUT</text><text x="190" y="462" font-size="14" fill="#555555">table data</text>
    <text x="452" y="433" font-size="17">GUI</text><text x="452" y="462" font-size="14" fill="#555555">desktop</text>
    <text x="712" y="433" font-size="17">DETERMINISTIC</text><text x="712" y="462" font-size="14" fill="#555555">pseudonymization</text>
    <text x="985" y="433" font-size="17">MASKED OUTPUT</text><text x="985" y="462" font-size="14" fill="#555555">local file</text>
  </g>
  <text x="110" y="354" font-family="Arial,sans-serif" font-size="15" fill="#C6442B" letter-spacing="3">LOCAL PROCESSING BOUNDARY</text>
  <text x="72" y="700" font-family="Arial,sans-serif" font-size="16" fill="#555555">GUI / PSEUDONYMIZATION / 1M-ROW BENCHMARK REPORTED</text>
