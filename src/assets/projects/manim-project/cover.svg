<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Manim Project rendering pipeline</title>
  <desc id="desc">Editorial pipeline showing version chain, Redis queue, isolated Runner, and Preview and Final artifacts.</desc>
  <rect width="1200" height="760" fill="#F4F0E8"/>
  <path d="M72 112H1128M72 648H1128" stroke="#C9BDA8" stroke-width="2"/>
  <text x="72" y="82" font-family="Georgia,serif" font-size="22" fill="#C6442B" letter-spacing="4">PROJECT 04 / EXPERIMENT</text>
  <text x="72" y="210" font-family="Georgia,serif" font-size="74" fill="#171717">Manim Project</text>
  <text x="74" y="260" font-family="Arial,sans-serif" font-size="20" fill="#555555">Versioned math animation, queued and isolated.</text>
  <g fill="none" stroke="#C6442B" stroke-width="4">
    <path d="M180 430H365M445 430H625M705 430H880"/><path d="M920 430V350M920 430V510"/>
  </g>
  <g fill="#F4F0E8" stroke="#171717" stroke-width="3">
    <rect x="92" y="374" width="202" height="112"/><rect x="365" y="374" width="202" height="112"/>
    <rect x="625" y="374" width="202" height="112"/><rect x="880" y="374" width="162" height="112"/>
    <rect x="842" y="298" width="156" height="62"/><rect x="842" y="500" width="156" height="62"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#171717">
    <text x="193" y="420" font-size="17">VERSION CHAIN</text><text x="193" y="449" font-size="14" fill="#555555">immutable</text>
    <text x="466" y="420" font-size="17">REDIS QUEUE</text><text x="466" y="449" font-size="14" fill="#555555">tasks</text>
    <text x="726" y="420" font-size="17">RUNNER</text><text x="726" y="449" font-size="14" fill="#555555">isolated</text>
    <text x="961" y="420" font-size="17">RENDER</text><text x="961" y="449" font-size="14" fill="#555555">artifacts</text>
    <text x="920" y="335" font-size="14">PREVIEW</text><text x="920" y="537" font-size="14">FINAL</text>
  </g>
  <text x="72" y="700" font-family="Arial,sans-serif" font-size="16" fill="#555555">AI MATH ANIMATION / QUEUE / ISOLATION</text>
</svg>
