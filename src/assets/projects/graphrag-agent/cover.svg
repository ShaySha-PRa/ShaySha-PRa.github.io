<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">GraphRAGAgent retrieval graph</title>
  <desc id="desc">Editorial diagram connecting REST API, vector retrieval, GraphRAG, D3 graph, and multi-turn questions.</desc>
  <rect width="1200" height="760" fill="#F4F0E8"/>
  <path d="M72 112H1128M72 648H1128" stroke="#C9BDA8" stroke-width="2"/>
  <text x="72" y="82" font-family="Georgia,serif" font-size="22" fill="#C6442B" letter-spacing="4">PROJECT 02 / KNOWLEDGE GRAPH</text>
  <text x="72" y="210" font-family="Georgia,serif" font-size="70" fill="#171717">GraphRAGAgent</text>
  <text x="74" y="260" font-family="Arial,sans-serif" font-size="20" fill="#555555">Retrieval paths made visible.</text>
  <g fill="none" stroke="#C6442B" stroke-width="4">
    <path d="M180 446L370 380L558 446L742 380L940 446"/><path d="M370 380L558 540L742 380"/><path d="M558 446V540"/>
  </g>
  <g fill="#F4F0E8" stroke="#171717" stroke-width="3">
    <circle cx="180" cy="446" r="70"/><circle cx="370" cy="380" r="70"/><circle cx="558" cy="446" r="70"/>
    <circle cx="742" cy="380" r="70"/><circle cx="940" cy="446" r="70"/><circle cx="558" cy="540" r="50"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#171717">
    <text x="180" y="440" font-size="17">QUESTION</text><text x="180" y="466" font-size="14" fill="#555555">multi-turn</text>
    <text x="370" y="374" font-size="17">REST API</text><text x="370" y="400" font-size="14" fill="#555555">25 endpoints</text>
    <text x="558" y="440" font-size="17">VECTOR</text><text x="558" y="466" font-size="14" fill="#555555">retrieval</text>
    <text x="742" y="374" font-size="17">GRAPHRAG</text><text x="742" y="400" font-size="14" fill="#555555">relations</text>
    <text x="940" y="440" font-size="17">D3 GRAPH</text><text x="940" y="466" font-size="14" fill="#555555">frontend view</text>
    <text x="558" y="545" font-size="13">CONTEXT</text>
  </g>
  <text x="72" y="700" font-family="Arial,sans-serif" font-size="16" fill="#555555">5 FRONTEND PAGES / 44 INTEGRATION TESTS REPORTED</text>
